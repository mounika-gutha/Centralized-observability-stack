apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: observability-demo
  namespace: observability
  labels: {release: monitoring}
spec:
  namespaceSelector:
    matchNames: [observability]
  selector:
    matchLabels: {app: observability-demo}
  endpoints:
  - {port: http, path: /metrics, interval: 15s}
