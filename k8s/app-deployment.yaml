apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-demo
  namespace: observability
  labels: {app: observability-demo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: observability-demo}
  template:
    metadata:
      labels: {app: observability-demo}
    spec:
      containers:
      - name: app
        image: observability-demo:local
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 8000}
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 15
